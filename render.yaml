services:
  - type: web
    name: ecocycle-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: SUPABASE_FUNCTIONS_URL
        sync: false
      - key: SUPABASE_FUNCTIONS_KEY
        sync: false
