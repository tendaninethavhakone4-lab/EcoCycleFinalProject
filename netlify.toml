[build]
  publish = "frontend"

# Proxy /api/* to the Render backend.
# After deploying to Render, replace the placeholder URL below
# with your actual Render service URL (e.g. https://ecocycle-api.onrender.com).
[[redirects]]
  from   = "/api/*"
  to     = "https://ecocycle-api.onrender.com/api/:splat"
  status = 200
  force  = true
